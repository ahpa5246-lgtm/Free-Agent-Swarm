name: Real free-tier coding agent (manual)

# Run only after reviewing the workflow and enabling free-tier API secrets.
# This workflow does not schedule work, buy tokens, merge or deploy.
on:
  workflow_dispatch:
    inputs:
      target_path:
        description: Existing file to edit (src/, tests/, docs/, or index.html)
        required: true
        type: string
        default: src/engine.mjs
      task:
        description: Narrow coding objective for this file (<=750 chars)
        required: true
        type: string
      confirm_free_tier:
        description: I verified ALL configured API accounts are on non-billable free tiers
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: free-agent-swarm-${{ github.repository }}
  cancel-in-progress: false
jobs:
  bounded-code-change:
    if: ${{ inputs.confirm_free_tier == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate code edit using free APIs only
        env:
          SWARM_CONFIRM_FREE_TIER: 'true'
          SWARM_TARGET_PATH: ${{ inputs.target_path }}
          SWARM_TASK: ${{ inputs.task }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/real-agent-runner.mjs
      - name: Verify actual code changes
        run: |
          if git diff --quiet; then echo 'No code change detected'; exit 1; fi
      - name: Apply quality gates
        run: npm run check
      - name: Open human-review draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PATH: ${{ inputs.target_path }}
          BASE_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="swarm/real-free-${RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- "$TARGET_PATH"
          git diff --cached --quiet && { echo 'Target file has no changes'; exit 1; }
          git commit -m "agent: bounded free-tier edit to ${TARGET_PATH}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          gh pr create --draft --base "$BASE_REF" --head "$branch" --title "Agent proposal: ${TARGET_PATH}" --body "Generated by a user-initiated, free-tier-only model request. CI passed at creation time. Review the diff, provider provenance, and security before merging. No automatic deployment."
      - name: Preserve redacted audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-agent-receipt-${{ github.run_id }}
          path: .swarm-reports/last-run.json
          if-no-files-found: ignore
          retention-days: 7
